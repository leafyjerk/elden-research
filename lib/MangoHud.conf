# elden-research's lean MangoHud config (elden-research install writes the log folder in).
# The usual Goverlay config polls ~60 stats plus shell exec lines, network, IO and
# battery, which costs CPU time every frame; this one shows the basics.
fps
frametime
frame_timing
gpu_stats
gpu_core_clock
gpu_temp
cpu_stats
core_load
ram
vram
position=top-left
font_size=20
toggle_hud=Shift_R+F12
# CSV capture into the logs folder: starts automatically 90 s after launch (time to
# load a save) and runs for 3 minutes; elden-research status reads it. Shift_L+F2
# also starts/stops one manually.
output_folder=@LOGS@
autostart_log=90
log_duration=180
toggle_logging=Shift_L+F2
